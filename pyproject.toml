[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cxf"
version = "0.1.0"
description = "Codex provider pointer manager"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mice", email = "cagedbird043@gmail.com" }]
dependencies = ["tomlkit>=0.13"]

[project.scripts]
cxf = "cxf.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
