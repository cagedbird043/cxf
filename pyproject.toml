[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cxf"
version = "0.1.0"
description = "Codex provider pointer manager"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mice", email = "cagedbird043@gmail.com" }]
dependencies = ["tomlkit>=0.13", "rich>=13.0"]

[project.scripts]
cxf = "cxf.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cxf = ["completions/_cxf"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I"]  # import ordering in tests not critical

[tool.pytest.ini_options]
pythonpath = ["src"]
