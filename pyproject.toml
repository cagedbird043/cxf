[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cxcfg"
version = "0.1.0"
description = "Terminal-first Codex config manager"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mice", email = "cagedbird043@gmail.com" }]
dependencies = []

[project.scripts]
cxcfg = "cxcfg.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
