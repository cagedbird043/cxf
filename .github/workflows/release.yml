name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cp target/release/cxf cxf-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: cxf-linux-amd64
          path: cxf-linux-amd64

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cp target/release/cxf cxf-darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: cxf-darwin-arm64
          path: cxf-darwin-arm64

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cxf-*
          merge-multiple: true

      - name: Checksums
        run: sha256sum cxf-* > checksums.txt

      - uses: softprops/action-gh-release@v1
        with:
          files: |
            cxf-*
            checksums.txt
          generate_release_notes: true
