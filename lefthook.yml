# lefthook.yml — cxf pre-commit hooks
pre-commit:
  commands:
    trailing-whitespace:
      glob: "**/*"
      run: sed -i 's/[[:space:]]*$//' {staged_files} && git add {staged_files}
      stage_fixed: true
    end-of-file-fixer:
      glob: "**/*"
      run: |
        for f in {staged_files}; do
          [ -s "$f" ] && [ "$(tail -c1 "$f")" != "" ] && echo >> "$f"
        done
        git add {staged_files}
      stage_fixed: true
    check-toml:
      glob: "**/*.toml"
      run: cargo fmt --check 2>/dev/null || true
    fmt:
      glob: "**/*.rs"
      run: cargo fmt --check
      fail_text: "Run: cargo fmt"
    clippy:
      glob: "**/*.rs"
      run: cargo clippy --all-targets -- -D warnings
      fail_text: "Fix clippy warnings above"
